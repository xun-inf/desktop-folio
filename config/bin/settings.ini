; folio 默认配置（模板）
; 首次运行会复制到 %APPDATA%\folio\settings.ini，程序只写用户目录那份。
; 模板里新增的 section 会在启动时补进用户配置（已有值不动）。

[engine]
; 帧定时器频率；0 = 跟片源（没有片源时用 30）
frame_rate=0

[media]
; 测试片源。相对路径按 <assets>/bin/ -> exe 目录 的顺序找；留空 = 用测试图案
source=test-1080p.mp4
; 播到结尾后是否从头再来
loop=1

[texture]
; 共享纹理帧池：0 = 自动（跟片源尺寸，没有片源时 1280x720）
; slots = 能容忍多少帧同时在途（消费者没还槽之前不会复写）
width=0
height=0
slots=3

[ipc]
; 请求超时（毫秒），只在 Electron 侧使用
request_timeout_ms=5000
